services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:2026.9.4
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=America/Sao_Paulo
    volumes:
      - /opt/homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro

  ha-mcp:
    container_name: ha-mcp
    image: ghcr.io/homeassistant-ai/ha-mcp:8.6.0
    command: ha-mcp-web
    restart: unless-stopped
    ports:
      - "8086:8086"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HOMEASSISTANT_URL=http://host.docker.internal:8123
      - HOMEASSISTANT_TOKEN=${HA_TOKEN:?set HA_TOKEN in .env}
      - MCP_SECRET_PATH=${HA_MCP_SECRET_PATH:?set HA_MCP_SECRET_PATH in .env}
    volumes:
      - ha-mcp-data:/home/mcpuser/.ha-mcp
    depends_on:
      - homeassistant

volumes:
  ha-mcp-data:
    name: ha-mcp-data
