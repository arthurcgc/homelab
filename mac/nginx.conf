worker_processes auto;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;

    map $http_upgrade $radar_connection {
        default upgrade;
        '' close;
    }

    map $request_uri $radar_metrics_cluster {
        default "";
        include /etc/nginx/radar/*.conf;
    }

    server {
        listen 80;

        # — Landing page
        location = / {
            add_header Cache-Control "no-cache";
            alias /usr/share/nginx/html/;
            try_files /index.html =404;
        }

        # — Glance
        location /glance/ {
            proxy_pass http://glance:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # — Quartz
        location /quartz/ {
            proxy_pass http://quartz:8082/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # — Glances
        location /glances/ {
            proxy_pass http://glances:61208/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /radar-metrics/ {
            if ($radar_metrics_cluster = "") {
                return 404;
            }
            limit_except GET POST {
                deny all;
            }
            resolver 127.0.0.11 valid=30s;
            set $radar_metrics_upstream http://radar-metrics:8080;
            rewrite ^/radar-metrics/[^/]+/(.*)$ /$1 break;
            proxy_pass $radar_metrics_upstream$uri$is_args$args;
            proxy_set_header X-Radar-Cluster $radar_metrics_cluster;
            proxy_read_timeout 60s;
        }

        location = /radar {
            return 301 /radar/;
        }

        location /radar/ {
            proxy_pass http://host.docker.internal:9280;
            proxy_http_version 1.1;
            proxy_set_header Host localhost:9280;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $radar_connection;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # — Paperless-ngx (runs in its own compose; reach via host port)
        location /paperless/ {
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
