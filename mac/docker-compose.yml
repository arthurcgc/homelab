services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./radar/local:/etc/nginx/radar:ro
    depends_on:
      - glance
      - glances
      - quartz
    networks:
      - homelab

  radar-metrics:
    image: quay.io/prometheuscommunity/prom-label-proxy:v0.15.1@sha256:186f9fe791158ef25d6f810109746ac0acdb35cb8401b554526c77c065483373
    container_name: radar-metrics
    restart: unless-stopped
    command:
      - -insecure-listen-address=0.0.0.0:8080
      - -upstream=${RADAR_PROMETHEUS_UPSTREAM:?Set RADAR_PROMETHEUS_UPSTREAM in mac/.env}
      - -rewrite-host-header-to=${RADAR_PROMETHEUS_HOST:?Set RADAR_PROMETHEUS_HOST in mac/.env}
      - -label=cluster
      - -header-name=X-Radar-Cluster
      - -enable-label-apis
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - homelab

  glance:
    image: glanceapp/glance:v0.8.6
    container_name: glance
    restart: unless-stopped
    volumes:
      - ../glance/config:/app/config
      - ../glance/assets:/app/assets
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    networks:
      - homelab

  glances:
    image: nicolargo/glances:latest-full
    container_name: glances
    restart: unless-stopped
    ports:
      - "61208:61208"
    read_only: true
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    tmpfs:
      - /tmp
    environment:
      - GLANCES_OPT=-w --enable-mcp
      - TZ=America/Sao_Paulo
      - PYTHONPYCACHEPREFIX=/tmp/py_caches
    networks:
      - homelab

  quartz:
    build: ../quartz
    container_name: quartz
    restart: unless-stopped
    volumes:
      - ${HOME}/notes:/usr/src/app/content:ro
      - ${HOME}/Documents:${HOME}/Documents:ro
      - ${HOME}/dotfiles:${HOME}/dotfiles:ro
      # Canonical Quartz customizations live in the homelab repo at ~/Documents/homelab/quartz/.
      # Bind-mounted at runtime so config/layout/style changes don't require an image rebuild.
      - ${HOME}/Documents/homelab/quartz/quartz.config.ts:/usr/src/app/quartz.config.ts:ro
      - ${HOME}/Documents/homelab/quartz/quartz.layout.ts:/usr/src/app/quartz.layout.ts:ro
      - ${HOME}/Documents/homelab/quartz/variables.scss:/usr/src/app/quartz/styles/variables.scss:ro
      - ${HOME}/Documents/homelab/quartz/custom.scss:/usr/src/app/quartz/styles/custom.scss:ro
    networks:
      - homelab

networks:
  homelab:
    driver: bridge
